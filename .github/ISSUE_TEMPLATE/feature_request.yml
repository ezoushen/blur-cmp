name: Feature Request
description: Suggest an idea for blur-cmp
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please describe the feature you'd like to see and why it would be useful.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: A clear and concise description of what you want to happen
      placeholder: "Add a BlurOverlayConfig option for..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      description: Which platform(s) should this feature support?
      multiple: true
      options:
        - Android
        - iOS
        - Both

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or code examples here
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
