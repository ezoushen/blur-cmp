name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile blur-cmp (Android)
        run: ./gradlew :blur-cmp:compileReleaseKotlinAndroid --no-configuration-cache

      - name: Compile blur-cmp (iOS)
        run: ./gradlew :blur-cmp:compileKotlinIosArm64 :blur-cmp:compileKotlinIosSimulatorArm64 --no-configuration-cache

      - name: Compile demo app (Android)
        run: ./gradlew :demoApp:compileDebugKotlinAndroid --no-configuration-cache
